name: URMA stability
on:
  pull_request:
    paths:
      - 'src/brpc/urma/**'
      - 'src/brpc/urma_transport.*'
      - 'test/brpc_urma*'
      - 'test/CMakeLists.txt'
      - 'tools/urma_stability.py'
      - '.github/workflows/urma-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libgflags-dev \
            libprotobuf-dev protobuf-compiler libleveldb-dev libsnappy-dev \
            zlib1g-dev libgtest-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DWITH_URMA=ON -DURMA_USE_MOCK=ON \
            -DBUILD_UNIT_TESTS=ON -DDOWNLOAD_GTEST=OFF \
            -DBRPC_SYSTEM_GTEST_SOURCE_DIR=/usr/src/googletest -DBUILD_BRPC_TOOLS=OFF
          cmake --build build --target brpc_urma_unittest brpc_urma_stability_unittest -j2
      - name: Run fault and data-path regressions
        run: ctest --test-dir build -R '^(brpc_urma_unittest|brpc_urma_stability_unittest|urma_stability_.*)$' --output-on-failure
